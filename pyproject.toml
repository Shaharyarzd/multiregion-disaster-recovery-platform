[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multiregion-disaster-recovery-platform"
version = "0.3.0"
description = "Active-active AWS disaster recovery orchestration and evidence platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "cryptography>=43,<47",
]
aws = ["boto3>=1.35,<2"]

[project.scripts]
drctl = "dr_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_platform"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=dr_platform --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dr_platform"]
