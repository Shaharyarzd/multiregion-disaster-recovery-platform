name: AWS OIDC claim preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/aws-oidc-preflight-job.yml
    with:
      environment_name: aws-deployment
      expected_sub: repo:Shaharyarzd/multiregion-disaster-recovery-platform:environment:aws-deployment
      role_arn: arn:aws:iam::293951765338:role/portfolio-dr-github-deploy

  recovery:
    uses: ./.github/workflows/aws-oidc-preflight-job.yml
    with:
      environment_name: aws-recovery-approval
      expected_sub: repo:Shaharyarzd/multiregion-disaster-recovery-platform:environment:aws-recovery-approval
      role_arn: arn:aws:iam::293951765338:role/portfolio-dr-github-recovery

  evidence:
    uses: ./.github/workflows/aws-oidc-preflight-job.yml
    with:
      environment_name: aws-evidence-approval
      expected_sub: repo:Shaharyarzd/multiregion-disaster-recovery-platform:environment:aws-evidence-approval
      role_arn: arn:aws:iam::293951765338:role/portfolio-dr-github-evidence
