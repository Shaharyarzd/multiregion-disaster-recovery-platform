name: Controlled AWS deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_DISPOSABLE_MILESTONE_2
        required: true
        type: string
      resume_run_id:
        description: Prior failed deployment run containing preserved Terraform state
        required: false
        default: ""
        type: string
      provision_stages:
        description: Phase two only; enable after exact API-ID IAM scope is installed
        required: true
        default: false
        type: boolean
      preserve_existing_synthetic_data:
        description: Resume after baseline; skip empty-resource untaint guards
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: portfolio-dr-aws-control-plane
  cancel-in-progress: false

jobs:
  deploy:
    environment: aws-deployment
    runs-on: ubuntu-latest
    steps:
      - name: Enforce explicit disposable-run confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "DEPLOY_DISPOSABLE_MILESTONE_2"

      - uses: actions/checkout@v4

      - name: Restore preserved Terraform state
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dr-deployment-state
          path: .
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_PRIMARY_REGION }}

      - name: Enforce account and region boundaries
        env:
          PRIMARY_REGION: ${{ vars.AWS_PRIMARY_REGION }}
          SECONDARY_REGION: ${{ vars.AWS_SECONDARY_REGION }}
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "293951765338"
          test "$PRIMARY_REGION" = "us-east-1"
          test "$SECONDARY_REGION" = "us-west-2"

      - name: Build Lambda artifact
        run: ./scripts/build-lambda.sh

      - name: Apply shared data boundary
        working-directory: terraform/stacks/global
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          PRESERVE_EXISTING_SYNTHETIC_DATA: ${{ inputs.preserve_existing_synthetic_data }}
        run: |
          terraform init -input=false
          if [ -n "$RESUME_RUN_ID" ]; then
            test "$(aws dynamodb describe-table --table-name portfolio-dr-transactions --region us-east-1 --query 'Table.TableStatus' --output text)" = "ACTIVE"
            test "$(aws kms describe-key --key-id de713abd-c143-49ac-8b9b-92d8d5aa2f8c --region us-east-1 --query 'KeyMetadata.KeyState' --output text)" = "Enabled"
            test "$(aws s3api head-bucket --bucket portfolio-dr-293951765338-us-east-1 --query BucketRegion --output text)" = "us-east-1"
            test "$(aws s3api head-bucket --bucket portfolio-dr-293951765338-us-west-2 --query BucketRegion --output text)" = "us-west-2"
            test "$(aws s3api head-bucket --bucket portfolio-dr-293951765338-evidence --query BucketRegion --output text)" = "us-east-1"
            test "$(aws s3api get-object-lock-configuration --bucket portfolio-dr-293951765338-evidence --query 'ObjectLockConfiguration.ObjectLockEnabled' --output text)" = "Enabled"
            if [ "$PRESERVE_EXISTING_SYNTHETIC_DATA" != "true" ]; then
              test "$(aws dynamodb describe-table --table-name portfolio-dr-transactions --region us-east-1 --query 'Table.ItemCount' --output text)" = "0"
              aws s3api list-object-versions --bucket portfolio-dr-293951765338-us-east-1 --output json | jq -e '((.Versions // []) | length) == 0 and ((.DeleteMarkers // []) | length) == 0' >/dev/null
              aws s3api list-object-versions --bucket portfolio-dr-293951765338-us-west-2 --output json | jq -e '((.Versions // []) | length) == 0 and ((.DeleteMarkers // []) | length) == 0' >/dev/null
              aws s3api list-object-versions --bucket portfolio-dr-293951765338-evidence --output json | jq -e '((.Versions // []) | length) == 0 and ((.DeleteMarkers // []) | length) == 0' >/dev/null
              terraform untaint module.data.aws_dynamodb_table.transactions || true
              terraform untaint module.data.aws_kms_key.evidence_signing || true
              terraform untaint module.data.aws_s3_bucket.primary || true
              terraform untaint module.data.aws_s3_bucket.secondary || true
              terraform untaint module.data.aws_s3_bucket.evidence || true
            fi
          fi
          terraform plan -input=false -out=global.tfplan
          if terraform show -json global.tfplan | jq -e 'any(.resource_changes[]?; (.change.actions | index("delete")) != null)' >/dev/null; then
            echo "Refusing shared-data plan containing destroy or replacement actions" >&2
            exit 1
          fi
          terraform apply -input=false -auto-approve global.tfplan

      - name: Apply Region A
        env:
          PROVISION_STAGES: ${{ inputs.provision_stages }}
        run: |
          ./scripts/apply-regional-stage.sh \
            terraform/stacks/region-a \
            active-a \
            "$PROVISION_STAGES" \
            "$(terraform -chdir=terraform/stacks/global output -raw table_name)" \
            "$(terraform -chdir=terraform/stacks/global output -raw table_arn)" \
            "$(terraform -chdir=terraform/stacks/global output -raw primary_kms_key_arn)"

      - name: Apply Region B
        env:
          PROVISION_STAGES: ${{ inputs.provision_stages }}
        run: |
          ./scripts/apply-regional-stage.sh \
            terraform/stacks/region-b \
            active-b \
            "$PROVISION_STAGES" \
            "$(terraform -chdir=terraform/stacks/global output -raw table_name)" \
            "$(terraform -chdir=terraform/stacks/global output -raw secondary_table_arn)" \
            "$(terraform -chdir=terraform/stacks/global output -raw secondary_kms_key_arn)"

      - name: Capture non-secret runtime context
        run: |
          jq -n \
            --arg account_id "$(aws sts get-caller-identity --query Account --output text)" \
            --arg primary_region "${{ vars.AWS_PRIMARY_REGION }}" \
            --arg secondary_region "${{ vars.AWS_SECONDARY_REGION }}" \
            --arg table_name "$(terraform -chdir=terraform/stacks/global output -raw table_name)" \
            --arg table_arn "$(terraform -chdir=terraform/stacks/global output -raw table_arn)" \
            --arg primary_bucket "$(terraform -chdir=terraform/stacks/global output -raw primary_bucket)" \
            --arg secondary_bucket "$(terraform -chdir=terraform/stacks/global output -raw secondary_bucket)" \
            --arg evidence_bucket "$(terraform -chdir=terraform/stacks/global output -raw evidence_bucket)" \
            --arg evidence_signing_key_arn "$(terraform -chdir=terraform/stacks/global output -raw evidence_signing_key_arn)" \
            --arg primary_api_id "$(terraform -chdir=terraform/stacks/region-a output -raw api_id)" \
            --arg secondary_api_id "$(terraform -chdir=terraform/stacks/region-b output -raw api_id)" \
            --arg primary_api "$(terraform -chdir=terraform/stacks/region-a output -raw api_endpoint)" \
            --arg secondary_api "$(terraform -chdir=terraform/stacks/region-b output -raw api_endpoint)" \
            --argjson stages_provisioned "${{ inputs.provision_stages }}" \
            '{account_id:$account_id,primary_region:$primary_region,secondary_region:$secondary_region,table_name:$table_name,table_arn:$table_arn,primary_bucket:$primary_bucket,secondary_bucket:$secondary_bucket,evidence_bucket:$evidence_bucket,evidence_signing_key_arn:$evidence_signing_key_arn,primary_api_id:$primary_api_id,secondary_api_id:$secondary_api_id,primary_api:$primary_api,secondary_api:$secondary_api,stages_provisioned:$stages_provisioned}' \
            > runtime-context.json

      - name: Preserve Terraform state and runtime context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dr-deployment-state
          path: |
            terraform/stacks/global/terraform.tfstate*
            terraform/stacks/region-a/terraform.tfstate*
            terraform/stacks/region-b/terraform.tfstate*
            runtime-context.json
          if-no-files-found: warn
          retention-days: 7
